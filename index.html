function findPolicyMappingConflict(number,vehicleId){const key=String(number||'').trim().toLowerCase();if(!key)return null;const otherVehicle=db.vehicles.find(x=>Number(x.id)!==Number(vehicleId)&&([x.policySubmission?.number,x.policy].some(n=>String(n||'').trim().toLowerCase()===key)));if(otherVehicle)return {vehicle:otherVehicle.reg||'another vehicle',customer:db.customers.find(c=>Number(c.id)===Number(otherVehicle.customer))?.name||'another customer'};const current=db.vehicles.find(x=>Number(x.id)===Number(vehicleId));const canonical=db.policies.find(x=>String(x.number||'').trim().toLowerCase()===key&&String(x.vehicle||'').trim().toLowerCase()!==String(current?.reg||'').trim().toLowerCase());if(canonical)return {vehicle:canonical.vehicle||'another vehicle',customer:canonical.customer||'another customer'};return null}
function submitVehiclePolicy(id){
 const v=db.vehicles.find(x=>Number(x.id)===Number(id));if(!v)return;const f=$('vp_file')?.files[0];if(!f)return alert('Please select the issued policy PDF or image.');
 if(f.size>4*1024*1024)return alert('Please select a file smaller than 4 MB in this browser demo.');
 const val=k=>$('vp_'+k)?.value.trim()||'';if(!val('insurer')||!val('number')||!val('type')||!val('expiry'))return alert('Complete insurer, policy number, policy type and expiry date.');
 if($('role').value==='Owner'&&(!val('commissionType')||!val('commissionValue')))return alert('Owner must enter commission type and value before submitting.');
 const conflict=findPolicyMappingConflict(val('number'),id);if(conflict){pcToast('Already exists: this policy is mapped to '+conflict.vehicle+' ('+conflict.customer+'). Duplicate mapping is not allowed.','error');return}
 const submitBtn=document.querySelector('button[onclick="submitVehiclePolicy('+id+')"]');if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Submitting…';submitBtn.setAttribute('aria-busy','true')}
 const reader=new FileReader();reader.onload=()=>{const previous=v.policySubmission||{};v.policySubmission={...previous,number:val('number'),insurer:val('insurer'),type:val('type'),start:val('start'),expiry:val('expiry'),premium:val('premium'),commissionType:$('role').value==='Owner'?val('commissionType'):(previous.commissionType||''),commissionValue:$('role').value==='Owner'?val('commissionValue'):(previous.commissionValue||''),paymentStatus:previous.paymentStatus||'Pending',fileName:f.name,data:reader.result,status:'Pending Verification',submittedAt:new Date().toISOString()};v.policyStatus='Pending Verification';persist();renderVehicleDetail();pcToast('Policy submitted successfully for Owner verification.')};reader.onerror=()=>{if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Proceed for Verification';submitBtn.removeAttribute('aria-busy')}pcToast('Could not read policy file. Please try again.','error')};reader.readAsDataURL(f);
}
function approveVehiclePolicy(id){
 if(!['Owner','Employee'].includes($('role').value))return alert('Only Owner/Admin or Employee can approve policy mapping.');
 const v=db.vehicles.find(x=>Number(x.id)===Number(id));if(!v||!v.policySubmission)return;const p=v.policySubmission;
 const conflict=findPolicyMappingConflict(p.number,id);if(conflict){pcToast('Already exists: this policy is mapped to '+conflict.vehicle+' ('+conflict.customer+'). Approval blocked.','error');return}
 const broker=$('vp_brokerSource')?.value||p.brokerSource||'';if(!broker)return alert('Select the broker / source before approving policy mapping.');p.brokerSource=broker;
 const ct=$('vp_commissionType')?.value||p.commissionType||'',cv=$('vp_commissionValue')?.value||p.commissionValue||'';
 if($('role').value==='Owner'&&(!ct||!cv||Number(cv)<0))return alert('Enter commission type and value before final approval.');
 if(ct&&cv){p.commissionType=ct;p.commissionValue=cv;const premium=Number(p.premium||0),raw=Number(cv);p.points=ct==='Percentage (%)'?Math.round(premium*raw/100):Math.round(raw)}
 p.status='Approved';p.brokerPaymentStatus=p.brokerPaymentStatus||'Pending';p.approvedAt=new Date().toISOString();p.approvedBy=pcActiveUser||$('role').value;v.policy=p.number;v.insurer=p.insurer;v.expiry=p.expiry;v.policyStatus='Approved';
 if(!db.policies.some(x=>x.number===p.number))db.policies.push({id:Date.now(),number:p.number,customer:db.customers.find(c=>c.id===v.customer)?.name||'',vehicle:v.reg,insurer:p.insurer,type:p.type||'Motor',premium:p.premium||'',expiry:p.expiry,status:'Approved',brokerSource:broker,brokerPaymentStatus:p.brokerPaymentStatus||'Pending'});
 const canonical=db.policies.find(x=>x.number===p.number);if(canonical){canonical.brokerSource=broker;canonical.brokerPaymentStatus=p.brokerPaymentStatus||'Pending'}persist();render();pcToast('Policy mapping approved successfully.')
}
